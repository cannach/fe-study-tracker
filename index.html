                card.innerHTML = `
                    <div class="schedule-date">${day.date} (${day.wd})</div>
                    <div class="schedule-theme">${day.theme}</div>
                    <div class="schedule-content">
                        <strong>予定時間:</strong> ${day.hours}時間
                    </div>
                    <div class="schedule-subject">
                        <strong>📖 科目A: ${day.subjectA_material}</strong>
                        ${day.subjectA_pages ? `ページ: ${day.subjectA_pages}` : ''}
                    </div>
                    <div class="schedule-subject">
                        <strong>💻 科目B: ${day.subjectB_material}</strong>
                        ${day.subjectB_pages ? `ページ: ${day.subjectB_pages}` : ''}
                    </div>
                    <div class="input-group">
                        <input type="number" class="actual-hours" data-date="${day.date}" placeholder="実績時間(h)" value="${scheduleData[day.date]?.actualHours || ''}">
                        <select class="status-select" data-date="${day.date}">
                            <option value="未着手" ${status === '未着手' ? 'selected' : ''}>未着手</option>
                            <option value="進行中" ${status === '進行中' ? 'selected' : ''}>進行中</option>
                            <option value="完了" ${status === '完了' ? 'selected' : ''}>完了</option>
                        </select>
                        <button class="save-btn" data-date="${day.date}">保存</button>
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const date = e.target.dataset.date;
                    const actualHours = parseFloat(document.querySelector(`.actual-hours[data-date="${date}"]`).value) || 0;
                    const status = document.querySelector(`.status-select[data-date="${date}"]`).value;
                    
                    scheduleData[date] = {actualHours, status};
                    syncToFirebase();
                    updateDashboard();
                });
            });
        }

        // ダッシュボード更新
        function updateDashboard() {
            let totalActual = 0;
            let completed = 0, inProgress = 0, notStarted = 0;
            
            Object.entries(scheduleData).forEach(([date, data]) => {
                totalActual += data.actualHours || 0;
                if(data.status === '完了') completed++;
                else if(data.status === '進行中') inProgress++;
                else notStarted++;
            });
            
            const achievementRate = Math.round((totalActual / 173.5) * 100);
            
            document.getElementById('total-actual-hours').textContent = totalActual.toFixed(1) + ' 時間';
            document.getElementById('achievement-rate').textContent = achievementRate + ' %';
            document.getElementById('completed-count').textContent = completed + ' 日';
            document.getElementById('inprogress-count').textContent = inProgress + ' 日';
            document.getElementById('notstarted-count').textContent = notStarted + ' 日';
            
            if(charts.weekProgress) {
                charts.weekProgress.data.datasets[0].data = [14.5, totalActual * 0.15, 19.0 * 0.2];
                charts.weekProgress.update();
            }
        }

        // 弱点管理テーブル
        function renderWeakness() {
            const tbody = document.getElementById('weakness-tbody');
            tbody.innerHTML = '';
            
            weaknessFields.forEach(field => {
                const row = tbody.insertRow();
                const levelClass = field.level === '要注意' ? 'weak' : field.level === '学習中' ? 'learning' : 'strong';
                
                row.innerHTML = `
                    <td>${field.name}</td>
                    <td><span class="status-badge ${levelClass}">${field.level}</span></td>
                    <td><input type="number" placeholder="%" min="0" max="100" value="${weaknessData[field.name]?.correctRate || '0'}" style="width: 60px;"></td>
                    <td>
                        <select onchange="updateWeakness('${field.name}', this.value)" style="padding: 0.3rem;">
                            <option value="未評価" ${field.level === '未評価' ? 'selected' : ''}>未評価</option>
                            <option value="要注意" ${field.level === '要注意' ? 'selected' : ''}>要注意</option>
                            <option value="学習中" ${field.level === '学習中' ? 'selected' : ''}>学習中</option>
                            <option value="習得" ${field.level === '習得' ? 'selected' : ''}>習得</option>
                        </select>
                    </td>
                `;
            });
        }

        // グローバル関数
        window.updateWeakness = function(field, level) {
            weaknessData[field] = {level};
            syncToFirebase();
        };

        // ナビゲーション
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                
                btn.classList.add('active');
                const panelId = btn.dataset.panel;
                document.getElementById(panelId).classList.add('active');
            });
        });

        // 初期化
        function init() {
            renderSchedule();
            renderWeakness();
            updateDashboard();
            
            const ctx = document.getElementById('weekProgressChart');
            charts.weekProgress = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['目標', '実績', '達成率'],
                    datasets: [{
                        label: '勉強時間(h)',
                        data: [14.5, 0, 10],
                        backgroundColor: ['#667eea', '#764ba2', '#10b981'],
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                }
            });
            
            syncToFirebase();
        }

        init();
    </script>
</body>
</html>

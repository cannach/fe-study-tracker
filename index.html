        async function syncToFirebase() {
            try {
                const userId = "user_001";
                const scheduleRef = ref(db, `users/${userId}/schedule`);
                const weaknessRef = ref(db, `users/${userId}/weakness`);
                await set(scheduleRef, scheduleData);
                await set(weaknessRef, weaknessData);
                document.getElementById('sync-status').textContent = '✅ Firebase同期完了';
                document.getElementById('sync-status').style.color = '#10b981';
            } catch (error) {
                document.getElementById('sync-status').textContent = '⚠️ 同期エラー';
                document.getElementById('sync-status').style.color = '#dc2626';
            }
        }

        function renderSchedule() {
            const container = document.getElementById('schedule-container');
            container.innerHTML = '';
            daysData.forEach(day => {
                const card = document.createElement('div');
                card.className = 'schedule-card';
                const status = scheduleData[day.date]?.status || '未着手';
                if(status === '完了') card.classList.add('completed');
                card.innerHTML = `
                    <div class="schedule-date">${day.date} (${day.wd})</div>
                    <div class="schedule-theme">${day.theme}</div>
                    <div class="schedule-content"><strong>予定時間:</strong> ${day.hours}時間</div>
                    ${day.hours > 0 ? `
                    <div class="schedule-subject"><strong>📖 科目A: ${day.subjectA_material}</strong>${day.subjectA_pages ? `ページ: ${day.subjectA_pages}` : ''}</div>
                    <div class="schedule-subject"><strong>💻 科目B: ${day.subjectB_material}</strong>${day.subjectB_pages ? `ページ: ${day.subjectB_pages}` : ''}</div>
                    ` : ''}
                    <div class="input-group">
                        <input type="number" class="actual-hours" data-date="${day.date}" placeholder="実績時間(h)" value="${scheduleData[day.date]?.actualHours || ''}" ${day.hours > 0 ? '' : 'disabled'}>
                        <select class="status-select" data-date="${day.date}" ${day.hours > 0 ? '' : 'disabled'}>
                            <option value="未着手" ${status === '未着手' ? 'selected' : ''}>未着手</option>
                            <option value="進行中" ${status === '進行中' ? 'selected' : ''}>進行中</option>
                            <option value="完了" ${status === '完了' ? 'selected' : ''}>完了</option>
                        </select>
                        <button class="save-btn" data-date="${day.date}" ${day.hours > 0 ? '' : 'disabled'}>保存</button>
                    </div>
                `;
                container.appendChild(card);
            });
            document.querySelectorAll('.save-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const date = e.target.dataset.date;
                    const actualHours = parseFloat(document.querySelector(`.actual-hours[data-date="${date}"]`).value) || 0;
                    const status = document.querySelector(`.status-select[data-date="${date}"]`).value;
                    scheduleData[date] = {actualHours, status};
                    syncToFirebase();
                    updateDashboard();
                });
            });
        }

        function updateDashboard() {
            let totalActual = 0, completed = 0, inProgress = 0, notStarted = 0;
            Object.entries(scheduleData).forEach(([date, data]) => {
                totalActual += data.actualHours || 0;
                if(data.status === '完了') completed++;
                else if(data.status === '進行中') inProgress++;
                else notStarted++;
            });
            const achievementRate = Math.round((totalActual / 173.5) * 100);
            document.getElementById('total-actual-hours').textContent = totalActual.toFixed(1) + 'h';
            document.getElementById('achievement-rate').textContent = achievementRate + '%';
            document.getElementById('completed-count').textContent = completed + '日';
            document.getElementById('inprogress-count').textContent = inProgress + '日';
            document.getElementById('notstarted-count').textContent = notStarted + '日';
            if(charts.weekProgress) {
                charts.weekProgress.data.datasets[0].data = [20, totalActual * 0.1, achievementRate];
                charts.weekProgress.update();
            }
        }

        function renderWeakness() {
            const tbody = document.getElementById('weakness-tbody');
            tbody.innerHTML = '';
            weaknessFields.forEach(field => {
                const row = tbody.insertRow();
                const levelClass = field.level === '要注意' ? 'weak' : field.level === '学習中' ? 'learning' : 'strong';
                row.innerHTML = `
                    <td>${field.name}</td>
                    <td><span class="status-badge ${levelClass}">${field.level}</span></td>
                    <td><input type="number" placeholder="%" min="0" max="100" value="0" style="width: 70px; padding: 0.5rem;"></td>
                    <td><select onchange="updateWeakness('${field.name}', this.value)" style="padding: 0.5rem; font-size: 0.9rem;"><option value="未評価">未評価</option><option value="要注意">要注意</option><option value="学習中">学習中</option><option value="習得">習得</option></select></td>
                `;
            });
        }

        window.updateWeakness = function(field, level) {
            weaknessData[field] = {level};
            syncToFirebase();
        };

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                const panelId = btn.dataset.panel;
                document.getElementById(panelId).classList.add('active');
            });
        });

        function init() {
            renderSchedule();
            renderWeakness();
            updateDashboard();
            const ctx = document.getElementById('weekProgressChart');
            if(ctx) {
                charts.weekProgress = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['今週予定(h)', '今週実績(h)', '達成率(%)'],
                        datasets: [{label: '', data: [20, 0, 0], backgroundColor: ['#667eea', '#764ba2', '#10b981']}]
                    },
                    options: {responsive: true, maintainAspectRatio: true, indexAxis: 'x'}
                });
            }
            syncToFirebase();
        }

        init();
    </script>
